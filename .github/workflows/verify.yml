name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Report development dependency advisories
        # Picomatch currently has no patched release; keep the full report visible.
        continue-on-error: true
        run: npm audit
      - name: Check production dependency advisories
        run: npm audit --omit=dev
      - run: npm run verify
        env:
          # Public fixture for synthetic CI builds only; never a deployment credential.
          VITE_GOOGLE_CLIENT_ID: 000000000000-ci-build.apps.googleusercontent.com
      - name: Install Redis for isolated integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server
      - run: npm run test:sync-redis

  browser-smoke:
    runs-on: ubuntu-latest
    # Browser/font setup plus the expanded responsive matrix can exceed ten minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
